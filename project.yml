name: Glow

options:
  bundleIdPrefix: com.georgklock
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Glow:
    type: application
    platform: iOS
    sources:
      - path: Glow
      # Explicit, and as a resource, because it has to land at the bundle root
      # of the shipped .app. See #132.
      - path: Glow/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    # Picks up a gitignored Local.xcconfig if there is one, which is where a
    # development team goes. See Signing.xcconfig.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # The group must be declared here, not in a hand-written file. xcodegen
    # GENERATES the file at `path`, so a path with no `properties` silently
    # overwrites it with an empty dict, and an empty entitlements file requests
    # nothing, signs cleanly against any profile, and leaves the widget unable
    # to see the store.
    entitlements:
      path: Glow/Glow.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.georgklock.glow
    # Tells Xcode's automatic signing that this target needs the App Groups
    # capability registered against the App ID. Without it the entitlements
    # file is compiled in but codesign strips it, because the wildcard profile
    # it picked never granted the group, and nothing warns you.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    # The glow:// scheme the widgets deep-link through — a widget opens the
    # app on its own screen. CFBundleURLTypes is a nested structure, which the
    # flat INFOPLIST_KEY_ settings below cannot express, so it rides in a
    # generated plist that Xcode merges with the generated keys.
    info:
      path: Glow/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.georgklock.glow
            CFBundleURLSchemes: [glow]
        # The app has no networking, so no non-exempt encryption. Declared
        # here so TestFlight never parks a build on "Missing Compliance"
        # waiting for the same click every upload.
        ITSAppUsesNonExemptEncryption: false
        # The Dynamic Island's pop is a Live Activity, and ActivityKit refuses
        # to start one without this key. It goes here rather than in a plist,
        # because Glow/Info.plist is generated from this file and untracked —
        # see #37 / #42.
        NSSupportsLiveActivities: true
        # The host's version, from the same two settings the widget reads.
        # Omitting them does not leave the keys out: xcodegen writes its own
        # defaults, so the host shipped a literal 1.0 / 1 while the widget
        # carried $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) and the two
        # bundles disagreed in every build. See #133.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - target: GlowWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgklock.glow
        PRODUCT_NAME: Glow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Manual signing, deliberately. Automatic signing needs an Apple ID in
        # Xcode's Accounts to mint profiles; without one it silently falls back
        # to the team's wildcard profile, which does not grant the App Group, and
        # codesign then strips the entitlement with no warning. These profiles
        # were generated on the developer portal and grant it. See
        # docs/ARCHITECTURE.md.
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: Glow Up Development
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Glow Up

  # The widget shares the model, logic and store with the app by compiling the
  # same files into both. A framework would avoid the duplication and cost a
  # dynamic link on every widget refresh, which is the wrong trade for four
  # folders of value types.
  GlowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GlowWidget
      - path: Glow/Logic
      - path: Glow/Models
      - path: Glow/Store
      - path: Glow/Glow
      - path: Glow/Views/HabitIconView.swift
      - path: Glow/Views/SlotMarkView.swift
      - path: Glow/Resources/SymbolCatalog.json
        buildPhase: resources
      # An appex is independently shipped and needs its own manifest at its own
      # bundle root; the app's does not cover it. See #132.
      - path: GlowWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    entitlements:
      path: GlowWidget/GlowWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.georgklock.glow
    # Tells Xcode's automatic signing that this target needs the App Groups
    # capability registered against the App ID. Without it the entitlements
    # file is compiled in but codesign strips it, because the wildcard profile
    # it picked never granted the group, and nothing warns you.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    # A widget extension needs NSExtensionPointIdentifier *nested* inside an
    # NSExtension dictionary. INFOPLIST_KEY_ settings can only write top-level
    # keys, and the resulting bundle fails to install with a placeholder error
    # that never mentions Info.plist.
    info:
      path: GlowWidget/Info.plist
      properties:
        CFBundleDisplayName: Glow Up
        # An extension whose version differs from its host app is a build
        # warning and an App Store rejection.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgklock.glow.widget
        PRODUCT_NAME: GlowWidget
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: Glow Up Widget Development
        CODE_SIGN_IDENTITY: Apple Development
        SKIP_INSTALL: YES
        # The widget compiles four of the app's source folders wholesale, so
        # the folders are the boundary and the folders can grow. This makes the
        # compiler the boundary instead: app-only API reaching the extension is
        # an error at the call site rather than a placeholder on the home
        # screen. Verified by Tools/check-project.py, which fails generation if
        # it is ever not YES here. See #107, #139.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  GlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Glow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.georgklock.glow.tests

  # Renders the widget's real view and diffs it against a committed design
  # export (#6). Its own target rather than more of GlowTests, because
  # GlowTests reaches the *app* module and the widget's view is not in it —
  # so this target compiles the widget's own sources, the same sharing the
  # widget target itself uses. GlowWidget.swift is excluded for its @main;
  # WeekEntry lives in its own file for exactly this reason.
  GlowRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenderTests
      - path: GlowWidget/WeekWidgetView.swift
      - path: GlowWidget/MonthWidget.swift
      - path: GlowWidget/WeekEntry.swift
      - path: Glow/Logic
      - path: Glow/Models
      - path: Glow/Store
      - path: Glow/Glow
      - path: Glow/Views/HabitIconView.swift
      - path: Glow/Views/SlotMarkView.swift
    # Hosted by the app, same as GlowTests — hostless, Bundle.main is the
    # xctest runner and HabitSymbol finds no SymbolCatalog.json, so "sunrise"
    # quietly renders as the text "s…" instead of a symbol. Measured, not
    # theorized.
    dependencies:
      - target: Glow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.georgklock.glow.rendertests

schemes:
  Glow:
    build:
      targets:
        Glow: all
        GlowWidget: all
        GlowTests: [test]
        GlowRenderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # `parallelizable: false` is load-bearing, and it is stated here rather
      # than left to xcodegen's default because something depends on it.
      #
      # Both suites and tests run sequentially, so a test that writes a
      # preference living in the App Group's shared defaults — one value for
      # the whole process — cannot overlap a test that reads it.
      #
      # Measured rather than assumed: two suites, one holding a rest day for
      # 1.5s and one reading 0.4s in, ran strictly one after the other.
      #
      # **The rest day is no longer one of those readers** (#181). It arrives
      # as a parameter, so `WeekGridTests` asserting R1, R2, R5 and R7 over all
      # 128 completion histories of a week is now correct by construction
      # rather than because nothing else happens to be setting one. What is
      # still shared is `WeekPreferences.firstWeekday`, which
      # `WeekCalendar.calendar` reads.
      #
      # Turning this on is still a real change, not a speed-up:
      # `TestPreferences` serialises the writers against each other, and the
      # week start would need the same treatment the rest day has had. See
      # #105 and #181.
      targets:
        - name: GlowTests
          parallelizable: false
        - name: GlowRenderTests
          parallelizable: false
