name: CI

on:
  push:
    branches: [main]
  pull_request:
  # **This is the minimum-iOS gate**, not a backstop for one. See the comment on
  # build-and-test-min: 06:00 UTC, so a compatibility failure is waiting in the
  # morning rather than in front of a merge.
  schedule:
    - cron: "0 6 * * *"
  # And on demand, for the case the schedule is too slow: a runtime-sensitive
  # change that has already merged and should be checked before the night.
  workflow_dispatch:

# Read-only by declaration, not only by the repository default. The default
# workflow permission is a setting a click can change; this line is a reviewed
# fact in the same diff as the jobs it governs. Nothing here writes to the
# repository — the artifact upload uses its own token scope, not contents.
permissions:
  contents: read

# A new push to a *branch* makes the previous run's answer irrelevant, and macOS
# runners are the expensive kind. A new push to `main` does not: each merge
# commit is a distinct state that shipped, so main queues rather than cancels.
#
# Note what this does *not* buy, because it was briefly relied on and should not
# be again: `cancel-in-progress: false` protects a run that has already started,
# and GitHub holds at most **one pending run per concurrency group**. When
# merges outpace CI, each new main run evicts the previous *pending* one — run
# 33230929897 was cancelled with zero jobs that way. Nothing load-bearing hangs
# on a main run surviving; the minimum-iOS gate is the nightly, which has the
# schedule to itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The gate's own tests, on a runner that costs nothing. Tools/validate-test-result.py
  # is what decides whether a green xcodebuild is really a pass, and a checker
  # nobody checks can weaken silently — so its mutations run first, on every
  # push, without waiting for a macOS runner. See #138.
  gate:
    name: Gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every third-party ref in this file is a full commit SHA, because a tag
      # is a pointer its owner can move without a commit here. The comment names
      # the release the SHA was resolved from; Tools/check-workflows.py fails
      # the build when either half is missing. Dependabot proposes updates as
      # SHA diffs, so pinning does not mean freezing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, because everything below trusts what this parses: the workflow
      # policy — full-SHA pins, version comments, least-privilege permissions —
      # is itself a gate that can weaken silently.
      - name: The workflows obey the pinning and permissions policy
        run: |
          python3 Tools/check-workflows.py --self-test
          python3 Tools/check-workflows.py

      - name: The validator rejects what it claims to reject
        run: python3 Tools/validate-test-result.py --self-test

      # The same argument for the release gate: it fabricates bundles on disk
      # and runs them past the same code the macOS steps call. Its signing
      # checks are exercised as facts rather than as artifacts, because this
      # runner has no codesign — which is the whole reason they are separable.
      - name: The release validator rejects what it claims to reject
        run: python3 Tools/check-release-build.py --self-test

      # #281: the entitlement denylist is a gate whose whole job is a build
      # that does not exist yet, so only fixtures can watch it fail. The real
      # check runs inside Tools/generate.sh on the macOS lane.
      - name: The project validator rejects what it claims to reject
        run: python3 Tools/check-project.py --self-test

      # #288: known documentation contradictions must not come back. The gate
      # proves itself against mutation fixtures, then checks the working tree.
      - name: The docs gate rejects what it claims to reject
        run: |
          python3 Tools/check-docs.py --self-test
          python3 Tools/check-docs.py

  build-and-test:
    name: Build and test
    # Pinned rather than macos-latest: the test suite reads gain-map metadata,
    # and where that metadata lives has already been seen to differ between
    # platform versions. Pin, and bump deliberately.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not `brew install xcodegen`, which resolves whatever is current on the
      # day. The version and the digest of its release archive are pinned in
      # Tools/xcodegen.pin, so this runner and a developer machine generate the
      # project with the same bytes. Cached by that version.
      - name: Cache the pinned XcodeGen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Tools/.xcodegen
          key: xcodegen-${{ hashFiles('Tools/xcodegen.pin') }}

      - name: Install the pinned XcodeGen
        run: Tools/install-xcodegen.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      # Generates, then reads the project back as a property list and fails if
      # App Groups, the entitlement or extension-only API enforcement is not
      # really there. Its own step so a capability failure is legible as one
      # rather than as a test failure.
      - name: Generate and validate the project
        run: Tools/generate.sh

      # Compiles the widget alone with -application-extension. The scheme build
      # covers it too; this fails on its own line, naming the call site, when
      # app-only API reaches the extension's shared sources.
      - name: Build the widget as an app extension
        run: |
          xcodebuild build \
            -project Glow.xcodeproj \
            -target GlowWidget \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO

      # The configuration and the SDK that actually ship. Release turns on
      # whole-module optimization and the device SDK is not the simulator SDK,
      # so this compiles code the test lane never compiles — and until now the
      # first build of it was the one Tools/ship-testflight.sh made, on the way
      # to an upload.
      #
      # Unsigned on purpose: signing needs a team and profiles that are
      # machine-local by design, and compiling is the part CI can own.
      #
      # The derived data path is explicit so the next step can name the product
      # it validates. A validator that goes looking for whichever app the
      # filesystem lists first is a validator that can pass on something nobody
      # shipped.
      - name: Build Release for the device SDK
        run: |
          xcodebuild build \
            -project Glow.xcodeproj \
            -scheme Glow \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/release-ci \
            CODE_SIGNING_ALLOWED=NO

      # #133: the host app and the widget it embeds must agree on both version
      # keys, and the appex has to be there at all. Neither is a build failure —
      # the answer used to arrive from App Store Connect after the upload.
      # Tools/ship-testflight.sh calls this same script on the archive and on
      # the exported .ipa, so the gate and the release path cannot disagree
      # about what "matching" means. Signing is not checked here: this build is
      # unsigned on purpose, and the release path passes --require-signing.
      - name: Validate the Release build
        run: |
          python3 Tools/check-release-build.py \
            build/release-ci/Build/Products/Release-iphoneos/Glow.app

      # Runs the suite into a unique result bundle under Artifacts/, then
      # validates that bundle: every declared test bundle present, every
      # inventory floor met, nothing skipped, no undeclared warning, and the
      # visual baseline's manifest attached. GLOW_ERASE_SIMULATOR makes the
      # lane's isolation explicit — the runner image is reused across jobs, and
      # #168 was a value one run left in a simulator's defaults for the next.
      - name: Run tests
        env:
          GLOW_ERASE_SIMULATOR: "1"
        run: Tools/test.sh

      # The verdict in the run summary, so a red build says what was wrong
      # without anyone downloading a 4MB bundle first. The markdown is written
      # by the validator itself, from the same report it exits on.
      - name: Publish the verdict
        if: always()
        run: |
          summary=$(ls Artifacts/*/summary.md 2>/dev/null | head -1 || true)
          if [ -n "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary was written — the run did not reach the validator." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Always, and an error when there is nothing to upload: the run that
      # failed is the run whose result bundle, log and rendered images are worth
      # the most, and a lane that quietly uploads nothing is a lane with no
      # evidence.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/
          if-no-files-found: error
          retention-days: 14

  # #286: the project declares iOS 18.0 and the lane above runs on whichever
  # runtime is newest — which proves nothing about the declared minimum; the
  # audited green run executed on iOS 26.5. This lane runs the same
  # authoritative suite on the oldest supported runtime, as its own job so a
  # compatibility failure is legible as one and the current lane's evidence
  # stays comparable to a developer machine's. Keeping the 18.0 target and
  # gating it is still the decision.
  #
  # **Nightly, not per-merge, since 2026-08-29.** #286 accepted the CI-time cost
  # without measuring who paid it. Measured: this lane is 40 minutes against the
  # current lane's 12, of which 36 are the suite itself — the same tests, 3.6x
  # slower on an iPhone SE 3 and a runtime downloaded fresh each run. The jobs
  # are parallel, so it *was* the whole of every pull request's feedback
  # latency, and every review comment, rebase and baseline re-approval paid it
  # again. Off the pull-request path, that feedback measured 9m13s.
  #
  # It first moved to `push: main`, and that did not work. Runs on `main` sat
  # pending behind a saturated macOS allowance, and GitHub keeps only one
  # pending run per concurrency group, so each merge evicted the previous
  # pending run — including this workflow's own (33230929897, cancelled with
  # zero jobs). A gate that a busy night silently skips is not a gate.
  #
  # So the schedule owns it. Once a day on the latest `main` is the right
  # cadence for a question that changes only when the deployment target or the
  # runtime does — neither of which moves per commit — and it costs one run a
  # day instead of one per merge, which is what kept the macOS runners free
  # enough for the latency win to be real. `workflow_dispatch` answers it on
  # demand, and the `ios18` label puts it back in front of a merge for a change
  # that warrants it.
  #
  # What that trades: an iOS-18-only regression can sit on `main` until the next
  # 06:00 UTC. #286's decision still holds — the 18.0 target is gated by a real
  # run of the authoritative suite on a real iOS 18 runtime — but it is gated
  # daily rather than per-merge. Label the pull request when that is not enough.
  build-and-test-min:
    name: Build and test (iOS 18)
    runs-on: macos-26
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ios18'))
    env:
      # The newest iOS 18 simulator runtime Apple ships. Bump deliberately;
      # the runtime cache key follows this value.
      GLOW_MIN_IOS: "18.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the pinned XcodeGen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Tools/.xcodegen
          key: xcodegen-${{ hashFiles('Tools/xcodegen.pin') }}

      - name: Install the pinned XcodeGen
        run: Tools/install-xcodegen.sh

      # The runner image ships only current runtimes, so the lane downloads
      # iOS 18 fresh on every run — a few minutes, measured. Deliberately NOT
      # cached: the dmg that `-downloadPlatform -exportPath` writes cannot be
      # installed by anything on this toolchain. `simctl runtime add` fails
      # with SimDiskImageErrorDomain code 6 ("the volume 'iOS 18.5 Simulator
      # Bundle' is read only") and `xcodebuild -importPlatform` registers the
      # image and abandons it Unusable ("Failed to clone … .cxbd") — both
      # reproduced locally on the same Xcode 26.6/macOS 26 pair with no cache
      # involved. Every green run of this lane took the download path; every
      # cache hit failed (runs 32917914973, 32963377540). An ~8 GB entry in
      # the 10 GB repository quota was also an eviction race. The dead cache
      # entries are deleted; the plain download is the one path that works,
      # and one path needs no fallback. See docs/decisions.md.
      - name: Install the iOS 18 simulator runtime
        run: |
          usable() {
            xcrun simctl runtime list | grep "iOS ${GLOW_MIN_IOS}" | grep -v Unusable
          }
          if usable; then
            echo "iOS ${GLOW_MIN_IOS} runtime already installed"
          else
            xcodebuild -downloadPlatform iOS -buildVersion "$GLOW_MIN_IOS"
          fi
          # The lane's own assertion, loud: no usable iOS 18 runtime, no lane.
          usable
          xcrun simctl runtime list

      # The smallest iPhone the declared minimum supports, created explicitly
      # rather than trusted to exist — the whole lane is about not inheriting
      # whatever the image happens to have.
      - name: Create the minimum-iOS iPhone
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes --json | /usr/bin/python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"]
                      if r.get("platform") == "iOS"
                      and r["version"].startswith("18.")
                      and r.get("isAvailable")]
          if not runtimes:
              raise SystemExit("error: no available iOS 18 runtime after install")
          print(max(runtimes, key=lambda r: r["version"])["identifier"])
          ')
          xcrun simctl create "Glow minimum iPhone" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation \
            "$RUNTIME_ID"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Generate and validate the project
        run: Tools/generate.sh

      # GLOW_EXPECTED_RUNTIME_MAJOR restricts selection to iOS 18 and then
      # asserts the chosen device matches — the lane fails loudly rather than
      # falling forward to the image's newer runtime, which is exactly the
      # failure #286 names.
      # The render suite runs here too, against this lane's own baseline:
      # RenderTests/Baselines/render-signatures-ios18.json, which #286 added
      # for exactly this reason. Both baselines move together on a visual
      # change — Tools/approve-baseline.sh is what keeps them from drifting,
      # which matters more now this lane reports after the merge.
      - name: Run tests on the minimum iOS
        env:
          GLOW_ERASE_SIMULATOR: "1"
          GLOW_EXPECTED_RUNTIME_MAJOR: "18"
        run: Tools/test.sh

      - name: Publish the verdict
        if: always()
        run: |
          summary=$(ls Artifacts/*/summary.md 2>/dev/null | head -1 || true)
          if [ -n "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary was written — the run did not reach the validator." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-run-min-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/
          if-no-files-found: error
          retention-days: 14
