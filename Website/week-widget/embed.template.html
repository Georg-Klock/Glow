  --icon-gap: calc(2.25px * var(--s));   /* WidgetMetrics.iconGap */

<script>
(function () {

  // Every plate, per tier, density and headroom step, as make-week-plates.swift
  // wrote it, with sizes and offsets in CSS pixels relative to the element the
  // plate sits over; the icon masks; the missed mark; and where the files
  // live. build-embed.py either inlines all of it here or, for Webflow's
  // 10,000-character code blocks, writes it to one JSON asset named on the
  // root element's data-manifest attribute and inlines null.

  // are filtered against today at seed time, so the card is plausible on any
  // weekday and shows a fresh week on Monday.
  var HABITS = [
    { slug: 'gratitude',   name: 'Gratitude',   target: 7, miss: -2 },
    { slug: 'stretch',     name: 'Stretch',     target: 4, pattern: [0, 1, 3, 5] },
    { slug: 'read-book',   name: 'Read Book',   target: 4, pattern: [0, 2, 4] },
    { slug: 'workout',     name: 'Workout',     target: 3, pattern: [1, 3] },
    { slug: 'vo2-max',     name: 'VO2 Max',     target: 2, pattern: [2] },
    { slug: 'tutorial',    name: 'Tutorial',    target: 3, pattern: [0, 3] },
    { slug: 'sunset',      name: 'Sunset',      target: 3, pattern: [1, 4] },
    { slug: 'early-night', name: 'Early night', target: 7, miss: -1 }
  ];
  var LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];   // Monday start, hardcoded for the demo
  var LAST = 6;
  var MIN_GAIN = 1, MAX_GAIN = 8;                        // GlowSettings.range

  // ─── Placement: WeekSpans.dividedWithoutRestDay + assignColumns, ported ─
  // A habit due N times draws N marks against seven columns. Completions
  // anchor on their day, lost reps are one-day ✕ on the earliest blank past
  // day, the open mark reaches back over unused days and ends on today (or
  // on Sunday when it is the final rep), and future reps divide what is left
  // with the remainder to the right. docs/week-marks.md §4.

    if (count <= 0 || columns < count) return [];
    var base = Math.floor(columns / count), extra = columns % count, out = [];
    for (var i = 0; i < count; i++) out.push(base + (i >= count - extra ? 1 : 0));
    return out;
  }
  function assignColumns(marks) {
    var count = marks.length, ends = [], previousEnd = -1, previousIndex = -1, i;
    for (i = 0; i < count; i++) {
      ends.push(null);
      if (marks[i].anchor === null) continue;
      var low = previousEnd + (i - previousIndex);
      var high = LAST - (count - 1 - i);
      var isFinal = i === count - 1 && (marks[i].state === 'done' || marks[i].state === 'open');
      var end = isFinal ? LAST : Math.max(low, Math.min(marks[i].anchor, high));
      ends[i] = end; previousEnd = end; previousIndex = i;
    }
    var spans = [], cursor = 0, runStart = 0;
    function push(mark, first, last) { spans.push({ state: mark.state, first: first, last: last }); }
    for (i = 0; i < count; i++) {
      if (ends[i] === null) continue;
      var w = widths(ends[i] - cursor, i - runStart), k;
      for (k = 0; k < w.length; k++) { push(marks[runStart + k], cursor, cursor + w[k] - 1); cursor += w[k]; }
      var first = marks[i].state === 'missed' ? ends[i] : cursor;
      push(marks[i], first, ends[i]);
      cursor = ends[i] + 1; runStart = i + 1;
    }
    var tail = widths(LAST - cursor + 1, count - runStart);
    for (i = 0; i < tail.length; i++) { push(marks[runStart + i], cursor, cursor + tail[i] - 1); cursor += tail[i]; }

  }
  function rowSpans(target, completed, today) {
    var done = Object.keys(completed).map(Number).sort(function (a, b) { return a - b; });

    if (canOpen) anchored.push({ state: 'open', anchor: today });

    img.onload = function () { img.dataset.state = img.naturalWidth ? 'ready' : 'broken'; applyGain(p); };

    var covered = ready(lower);
    Object.keys(p.imgs).forEach(function (g) {
      var img = p.imgs[g];

    var wantHDR = hdrQuery.matches;
    root.classList.toggle('gw-hdr', wantHDR);

    if (set !== currentSet) {

      plates.forEach(function (p) {
        Object.keys(p.imgs).forEach(function (g) { p.imgs[g].remove(); });

      applyCard();

    host.className = 'gw-i'; host.dataset.slug = slug;
    var live = document.createElement('span'); live.className = 'gw-live';
    host.appendChild(live);
    iconHosts.push(host);
    plate(host, 'icon-' + slug);
    return host;
  }
  function missedNode() {
    var img = document.createElement('img');
    img.className = 'gw-cross'; img.alt = ''; img.setAttribute('aria-hidden', 'true'); img.draggable = false;
    missedImgs.push(img);
    return img;
  }

  function buildHeader() {
    headerEl.innerHTML = '';
    var spacer = document.createElement('div'); spacer.className = 'gw-header-spacer';
    headerEl.appendChild(spacer);
    var days = document.createElement('div'); days.className = 'gw-days';
    LETTERS.forEach(function (letter, i) {
      var day = document.createElement('div'); day.className = 'gw-day';
      var t = textNode(letter, 'day-' + letter, 'gw-day-t');
      t.dataset.column = i;
      day.appendChild(t); days.appendChild(day);
    });
    headerEl.appendChild(days);
  }

  function buildRows() {
    rowsEl.innerHTML = '';
    iconHosts = []; missedImgs = [];
    plates = plates.filter(function (p) { return headerEl.contains(p.host); });
    rows.forEach(function (row, index) {
      var el = document.createElement('div'); el.className = 'gw-row';
      var label = document.createElement('div'); label.className = 'gw-label';
      var iconCol = document.createElement('div'); iconCol.className = 'gw-icon-col';
      row.icon = iconNode(row.habit.slug);
      iconCol.appendChild(row.icon);
      row.name = textNode(row.habit.name, 'name-' + row.habit.slug, 'gw-name');
      label.appendChild(iconCol); label.appendChild(row.name);
      var track = document.createElement('div'); track.className = 'gw-track';
      row.track = track;
      el.appendChild(label); el.appendChild(track);
      rowsEl.appendChild(el);
      renderRow(index);
    });
    loadPlates();
    updateTiers();
  }

  function renderRow(index) {
    var row = rows[index];
    row.spans = rowSpans(row.habit.target, row.completed, today);
    row.track.innerHTML = '';
    missedImgs = missedImgs.filter(function (img) { return document.contains(img); });
    row.spans.forEach(function (span) {
      var n = span.last - span.first + 1;
      var tappable = span.state === 'open' || (span.state === 'done' && span.first <= today && today <= span.last && row.completed[today]);
      var el = document.createElement(tappable ? 'button' : 'div');
      el.className = 'gw-span is-' + span.state;
      el.style.setProperty('--first', span.first);
      el.style.setProperty('--n', n);
      if (tappable) {
        el.type = 'button';
        el.setAttribute('aria-label', row.habit.name + (span.state === 'open' ? ', open today. Mark done' : ', done today. Undo'));
        el.addEventListener('click', function () { toggleToday(index); });
      }
      if (span.state === 'missed') {
        el.appendChild(missedNode());
      } else {
        var socket = document.createElement('div'); socket.className = 'gw-socket'; el.appendChild(socket);
        if (span.state === 'done') {
          var done = document.createElement('div'); done.className = 'gw-done'; el.appendChild(done);
        } else if (span.state === 'open') {
          var ring = document.createElement('div'); ring.className = 'gw-ring gw-live'; el.appendChild(ring);
          el.classList.add('is-emitting');
          plate(el, 'ring-' + n);
        }
      }
      row.track.appendChild(el);
    });
  }

  function toggleToday(index) {
    var row = rows[index];
    if (row.completed[today]) delete row.completed[today]; else row.completed[today] = true;
    // Invariant 7: completing today changes the open window to filled without
    // moving the remaining future windows, so the row can simply be redrawn.
    plates = plates.filter(function (p) { return !row.track.contains(p.host); });
    renderRow(index);
    applyMasks();
    applyGainAll();
    updateTiers();
  }

  // TypeTier: a name and its icon emit while the row has an open mark today;
  // today's letter emits while any row does. Everything else is lit.
  function updateTiers() {
    var anyOpen = false;
    rows.forEach(function (row) {
      var open = row.spans.some(function (s) { return s.state === 'open'; });
      anyOpen = anyOpen || open;
      row.name.classList.toggle('is-emitting', open);
      row.icon.classList.toggle('is-emitting', open);
    });
    var letters = headerEl.querySelectorAll('.gw-day-t');
    for (var i = 0; i < letters.length; i++) {
      letters[i].classList.toggle('is-emitting', i === today && anyOpen);
    }
  }

  // ─── The slider ────────────────────────────────────────────────────────
  function setGain(v) {
    gainValue = Math.max(MIN_GAIN, Math.min(MAX_GAIN, v));
    outEl.textContent = (Math.round(gainValue * 10) / 10).toString().replace(/\.0$/, '') + '×';
    applyGainAll();
  }
  rangeEl.addEventListener('input', function () { setGain(parseFloat(rangeEl.value)); });

  // ─── Tilt ──────────────────────────────────────────────────────────────
  // A slow, weighty float under a fine pointer. Nothing on touch, nothing
  // under reduced motion: the card just sits.
  (function tilt() {
    var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    root.dataset.tilt = (fine.matches && !reduced.matches) ? 'on' : 'off';
    if (!fine.matches || reduced.matches) return;
    var MAX = 7, targetX = 0, targetY = 0, x = 0, y = 0, running = false;
    function frame() {
      x += (targetX - x) * 0.055; y += (targetY - y) * 0.055;
      card.style.setProperty('--tilt-y', (x * MAX).toFixed(3) + 'deg');
      card.style.setProperty('--tilt-x', (-y * MAX).toFixed(3) + 'deg');
      card.style.setProperty('--shadow-x', (-x * 22).toFixed(2) + 'px');
      card.style.setProperty('--shadow-y', (-y * 22).toFixed(2) + 'px');
      if (Math.abs(targetX - x) + Math.abs(targetY - y) > 0.0005) requestAnimationFrame(frame);
      else running = false;
    }
    function kick() { if (!running) { running = true; requestAnimationFrame(frame); } }
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      var r = card.getBoundingClientRect();
      var dx = (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2);
      var dy = (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2);
      targetX = Math.max(-1, Math.min(1, dx)); targetY = Math.max(-1, Math.min(1, dy));
      kick();
    }, { passive: true });
    document.addEventListener('pointerleave', function () { targetX = 0; targetY = 0; kick(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { targetX = 0; targetY = 0; kick(); } });
    reduced.addEventListener('change', function (e) { if (e.matches) { targetX = targetY = x = y = 0; card.style.transform = ''; } });
  })();

  // ─── Boot ──────────────────────────────────────────────────────────────
  function boot(data) {
    useData(data);
    seed(); buildHeader(); buildRows();
    setGain(parseFloat(rangeEl.value) || 2);

    hdrQuery.addEventListener('change', loadPlates);                 // moved to another screen
    Object.keys(tierQueries).forEach(function (k) { tierQueries[k].addEventListener('change', loadPlates); });
    window.addEventListener('resize', loadPlates);                   // devicePixelRatio has no event of its own

    // A day boundary re-seeds: "today" is the visitor's date, not the load time.
    (function scheduleMidnight() {
      var now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
      setTimeout(function () { seed(); buildRows(); scheduleMidnight(); }, next - now);
    })();
  }
  if (INLINE) {
    boot(INLINE);
  } else if (root.dataset.manifest) {
    // One request, before anything is drawn, for the manifest. If it fails the
    // card still draws — every tier as live CSS, no plates, as on an SDR screen.
    fetch(root.dataset.manifest, { credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(boot, function () { boot({ manifests: {} }); });
  }

  // For the page's own checks (and nothing else): what the card decided.
  window.GlowWeek = {
    get set() { return currentSet; }, get hdr() { return hdrQuery.matches; }, get today() { return today; },
    get gain() { return gainValue; }, set gain(v) { rangeEl.value = v; setGain(v); },
    plates: function () { return plates.map(function (p) { return { key: p.key, imgs: Object.keys(p.imgs).map(function (g) { return g + ':' + (p.imgs[g].dataset.state || 'loading') + ':' + p.imgs[g].style.display + '@' + p.imgs[g].style.opacity; }) }; }); },
    rows: function () { return rows.map(function (r) { return { name: r.habit.name, spans: r.spans }; }); }
  };
})();
</script>
