<style>
/* ─── Geometry ───────────────────────────────────────────────────────────
   Everything is the app's 24pt reference cell times one scale, --s, so the
   ratios in WidgetMetrics / SlotLayout / GlowShape survive at every tier.
   The tiers are discrete on purpose: a plate is a fixed raster and the CSS
   below must land on the exact sizes the plates were cut at. */
.gw { --s: 2; }                                   /* desktop: 48px cell */
@media (max-width: 959px) { .gw { --s: 1.5; } }   /* tablet:  36px cell */
@media (max-width: 599px) { .gw { --s: 0.875; } } /* mobile:  21px cell */

.gw {
  --cell: calc(24px * var(--s));
  --gap: calc(8px * var(--s));           /* SlotLayout.gapRatio 8/24 — both axes */
  --text: calc(12px * var(--s));         /* WidgetMetrics.textSize */
  --icon-w: calc(24px * var(--s));       /* WidgetMetrics.iconWidth */
  --icon-gap: calc(2.25px * var(--s));   /* WidgetMetrics.iconGap */
  --icon-box: calc(15px * var(--s));     /* the glyph's square; see make-week-plates --icon-box */
  --label-w: calc(98px * var(--s));      /* WidgetMetrics.labelWidth */
  --label-gap: calc(4px * var(--s));     /* WidgetMetrics.labelGap */
  --header-h: calc(14px * var(--s));     /* WidgetMetrics.headerHeight */
  --header-gap: calc(4px * var(--s));    /* WidgetMetrics.headerGap */
  --inset: calc(1px * var(--s));         /* GlowShape.socketInset */
  --ring: calc(1px * var(--s));          /* GlowShape.ringWeight */
  --bevel: calc(1.5px * var(--s));       /* SlotMarkView.bevel = cell/16 */
  --well: calc(6px * var(--s));          /* SlotMarkView.well = cell/4 */
  --pad-l: calc(6px * var(--s));         /* WidgetMetrics.padLeading */
  --pad-r: calc(14px * var(--s));        /* WidgetMetrics.padTrailing */
  --pad-t: calc(10px * var(--s));        /* WidgetMetrics.padTop */
  --pad-b: calc(14px * var(--s));        /* WidgetMetrics.padBottom */
  --radius: calc(22px * var(--s));
  --lit: #D9D9D9;                        /* GlowPalette.lit */
  --resting: rgba(217, 217, 217, 0.5);   /* GlowPalette.greyResting — marks only, never text */
  --emitting-sdr: #FFFFFF;               /* what emitting means on a screen without headroom */
  --tilt-x: 0deg; --tilt-y: 0deg; --shadow-x: 0px; --shadow-y: 0px;

  display: flex; justify-content: center;
  padding: calc(40px * var(--s)) 0;
  perspective: calc(900px * var(--s));
  font-family: 'GW Inter', 'Inter', system-ui, -apple-system, sans-serif;
  font-weight: 400; font-synthesis: none;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  user-select: none; -webkit-user-select: none;
}
.gw *, .gw *::before, .gw *::after { box-sizing: border-box; }
.gw img { max-width: none; }             /* Webflow's global img rule squashed the word slider */

/* ─── The card ─────────────────────────────────────────────────────────── */
.gw-card {
  position: relative;
  background: #000;                      /* the black every plate was cut against */
  border-radius: var(--radius);
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
  transform-style: preserve-3d;
  box-shadow:
    var(--shadow-x) calc(var(--shadow-y) + 18px * var(--s)) calc(48px * var(--s)) rgba(0, 0, 0, 0.42),
    var(--shadow-x) calc(var(--shadow-y) + 4px * var(--s)) calc(12px * var(--s)) rgba(0, 0, 0, 0.28);
  will-change: transform;

/* ─── Header ───────────────────────────────────────────────────────────── */
.gw-header {
  display: flex; align-items: center; gap: var(--label-gap);
  height: var(--header-h); margin-bottom: var(--header-gap);
}
.gw-header-spacer { width: var(--label-w); flex: none; }
.gw-days { display: flex; gap: var(--gap); }
.gw-day {
  width: var(--cell); display: flex; justify-content: center; align-items: center;
}

/* ─── Rows ─────────────────────────────────────────────────────────────── */
.gw-rows { display: flex; flex-direction: column; gap: var(--gap); }
.gw-row { display: flex; align-items: center; gap: var(--label-gap); height: var(--cell); }
.gw-row.is-spacer { height: var(--cell); }
.gw-label {
  width: var(--label-w); flex: none; display: flex; align-items: center; overflow: hidden;
}
.gw-icon-col {
  width: var(--icon-w); flex: none; display: flex; justify-content: center;
  margin-right: var(--icon-gap);
}

/* ─── Type: live text, with the plate over it ─────────────────────────── */
.gw-t {
  position: relative; display: inline-block; white-space: nowrap;
  font-size: var(--text);
  /* Inter's ascent + descent (0.96875 + 0.2421875 em). The plate was cut on
     the same typographic box, so with this line height the two share a
     baseline. If the font is ever swapped, this number goes with it. */
  line-height: 1.2109375;
  color: var(--lit);
}
.gw-t.is-emitting { color: var(--emitting-sdr); }
.gw-i {
  position: relative; display: block; width: var(--icon-box); height: var(--icon-box);
  color: var(--lit);
}
.gw-i.is-emitting { color: var(--emitting-sdr); }
.gw-i > svg { display: block; width: 100%; height: 100%; }
.gw-live { display: inline; }

/* The plate: hidden until it has decoded, and only ever shown on a screen
   with headroom, over an element that is emitting. It is opaque black, so it
   covers its live twin completely; the twin is also hidden so nothing bleeds
   at the plate's edge. */
.gw-plate { position: absolute; display: none; pointer-events: none; }
.gw-hdr .is-emitting.has-plate > .gw-plate.is-ready { display: block; }
.gw-hdr .is-emitting.has-plate > .gw-live { visibility: hidden; }

/* ─── Marks ────────────────────────────────────────────────────────────── */
.gw-track {
  position: relative; flex: none;
  width: calc(7 * var(--cell) + 6 * var(--gap)); height: var(--cell);
}
.gw-span {
  position: absolute; top: 0; height: var(--cell);
  left: calc(var(--first) * (var(--cell) + var(--gap)));
  width: calc(var(--n) * var(--cell) + (var(--n) - 1) * var(--gap));
  margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit;
  -webkit-appearance: none; appearance: none;
}
/* Paint order. A plate is opaque black out to its halo padding, which is wider
   than half a gap, so an open ring's plate would cover the sockets beside it
   and the rows above and below. Everything that is not a plate paints on top
   instead: the card and the plate are the same #000, so a socket drawn over a
   plate's surround is indistinguishable from one drawn over the card, and only
   the halo goes behind the neighbour — which is where spilled light belongs.
   Nothing between here and .gw-card may open a stacking context, or rows stop
   sharing one order. */
.gw-span.is-open { z-index: 0; }
.gw-span:not(.is-open) { z-index: 1; }
.gw-icon-col { position: relative; z-index: 2; }   /* above the name plate's left padding */
.gw-t.gw-name { z-index: 1; }
button.gw-span { cursor: pointer; }
button.gw-span:focus-visible { outline: 2px solid var(--lit); outline-offset: 2px; border-radius: 999px; }

/* The socket: SlotMarkView.socket — 15% black, a black bevel on the top
   edge and a 13% white one on the bottom. On #000 only the bottom rim shows,
   which is how the This Week screen looks too. */
.gw-socket {
  position: absolute; inset: 0; border-radius: 999px;
  background: rgba(0, 0, 0, 0.15);
  box-shadow:
    inset 0 var(--bevel) calc(2 * var(--bevel)) #000,
    inset 0 calc(-1 * var(--bevel)) calc(2 * var(--bevel)) rgba(255, 255, 255, 0.13);
}
/* Done: SlotMarkView.doneMark — the lit fill, a white rim at the top, a 30%
   black one at the bottom, and a soft well a quarter-cell deep. */
.gw-done {
  position: absolute; inset: var(--inset); border-radius: 999px;
  background: var(--lit);
  box-shadow:
    inset 0 var(--well) calc(2 * var(--well)) rgba(0, 0, 0, 0.25),
    inset 0 calc(-1 * var(--inset)) calc(2 * var(--inset)) rgba(0, 0, 0, 0.30),
    inset 0 var(--inset) calc(2 * var(--inset)) #fff;
}
/* Open: the ring. Live version is the SDR fallback; the plate sits over it. */
.gw-ring {
  position: absolute; inset: var(--inset); border-radius: 999px;
  border: var(--ring) solid var(--emitting-sdr);
}
/* Missed: CrossShape in its own well. No socket underneath. */
.gw-cross { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

/* ─── Motion ───────────────────────────────────────────────────────────── */
.gw-card { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .gw-card { transform: none !important; }
}
</style>

<script>

  // sits over; the icon outlines; and where the files live. build-embed.py

  }

  // ─── Content ───────────────────────────────────────────────────────────
  // The app's default seed list, in order. `pattern` is the demo's history:
  // the columns (Monday = 0) that count as completed once they are in the
  // past. `miss` is a day a daily habit was skipped, relative to today. Both
  // are filtered against today at seed time, so the card is plausible on any
  // weekday and shows a fresh week on Monday.
  var HABITS = [
    { slug: 'gratitude',   name: 'Gratitude',   target: 7, miss: -2 },
    { slug: 'stretch',     name: 'Stretch',     target: 4, pattern: [0, 1, 3, 5] },
    { slug: 'read-book',   name: 'Read Book',   target: 4, pattern: [0, 2, 4] },
    { slug: 'workout',     name: 'Workout',     target: 3, pattern: [1, 3] },
    { slug: 'vo2-max',     name: 'VO2 Max',     target: 2, pattern: [2] },
    { slug: 'tutorial',    name: 'Tutorial',    target: 3, pattern: [0, 3] },
    { slug: 'sunset',      name: 'Sunset',      target: 3, pattern: [1, 4] },
    { slug: 'early-night', name: 'Early night', target: 7, miss: -1 }
  ];
  var LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];   // Monday start, hardcoded for the demo
  var LAST = 6;

  // ─── Placement: WeekSpans.dividedWithoutRestDay + assignColumns, ported ─
  // A habit due N times draws N marks against seven columns. Completions
  // anchor on their day, lost reps are one-day ✕ on the earliest blank past
  // day, the open mark reaches back over unused days and ends on today (or
  // on Sunday when it is the final rep), and future reps divide what is left
  // with the remainder to the right. docs/week-marks.md §4.
  function widths(columns, count) {
    if (count <= 0 || columns < count) return [];
    var base = Math.floor(columns / count), extra = columns % count, out = [];
    for (var i = 0; i < count; i++) out.push(base + (i >= count - extra ? 1 : 0));
    return out;
  }
  function assignColumns(marks) {
    var count = marks.length, ends = [], previousEnd = -1, previousIndex = -1, i;
    for (i = 0; i < count; i++) {
      ends.push(null);
      if (marks[i].anchor === null) continue;
      var low = previousEnd + (i - previousIndex);
      var high = LAST - (count - 1 - i);
      var isFinal = i === count - 1 && (marks[i].state === 'done' || marks[i].state === 'open');
      var end = isFinal ? LAST : Math.max(low, Math.min(marks[i].anchor, high));
      ends[i] = end; previousEnd = end; previousIndex = i;
    }
    var spans = [], cursor = 0, runStart = 0;
    function push(mark, first, last) { spans.push({ state: mark.state, first: first, last: last }); }
    for (i = 0; i < count; i++) {
      if (ends[i] === null) continue;
      var w = widths(ends[i] - cursor, i - runStart), k;
      for (k = 0; k < w.length; k++) { push(marks[runStart + k], cursor, cursor + w[k] - 1); cursor += w[k]; }

      push(marks[i], first, ends[i]);
      cursor = ends[i] + 1; runStart = i + 1;
    }
    var tail = widths(LAST - cursor + 1, count - runStart);
    for (i = 0; i < tail.length; i++) { push(marks[runStart + i], cursor, cursor + tail[i] - 1); cursor += tail[i]; }
    return spans;
  }
  function rowSpans(target, completed, today) {
    var done = Object.keys(completed).map(Number).sort(function (a, b) { return a - b; });
    var doneToday = !!completed[today];
    var repsLeft = Math.max(0, target - done.length);
    var actionableLeft = 0, c;
    for (c = today; c <= LAST; c++) if (!completed[c]) actionableLeft++;
    var lost = Math.max(0, repsLeft - actionableLeft), live = repsLeft - lost;
    var blankPast = [];
    for (c = 0; c < today; c++) if (!completed[c]) blankPast.push(c);
    var anchored = done.map(function (d) { return { state: 'done', anchor: d }; });
    blankPast.slice(0, lost).forEach(function (d) { anchored.push({ state: 'missed', anchor: d }); });
    var canOpen = live > 0 && !doneToday;
    if (canOpen) anchored.push({ state: 'open', anchor: today });
    anchored.sort(function (a, b) { return a.anchor - b.anchor; });
    var upcoming = live - (canOpen ? 1 : 0);
    for (c = 0; c < upcoming; c++) anchored.push({ state: 'upcoming', anchor: null });
    return assignColumns(anchored);
  }

  // ─── State ─────────────────────────────────────────────────────────────
  // In memory only. Nothing here is stored or sent; a reload starts over.
  var root = document.getElementById('gw');
  if (!root) return;   // site-wide code on a page without the card
  var card = document.getElementById('gw-card');
  var headerEl = document.getElementById('gw-header');
  var rowsEl = document.getElementById('gw-rows');
  var today = todayIndex();
  var rows = [];

  function todayIndex() { return (new Date().getDay() + 6) % 7; }

  function seed() {
    today = todayIndex();
    rows = HABITS.map(function (h) {
      var completed = {}, c;
      if (h.target === 7) {
        for (c = 0; c < today; c++) if (c !== today + h.miss) completed[c] = true;
      } else {
        h.pattern.forEach(function (d) { if (d < today) completed[d] = true; });
      }
      return { habit: h, completed: completed, spans: [] };

    mobile: window.matchMedia('(max-width: 599px)'),
    tablet: window.matchMedia('(min-width: 600px) and (max-width: 959px)')

    var changed = set !== currentSet;
    currentSet = set;
    plates.forEach(function (p) {

      p.img.style.width = entry.cssWidth + 'px';
      p.img.style.height = entry.cssHeight + 'px';
      p.img.style.left = entry.offsetLeft + 'px';

      // loads but has no pixels reports naturalWidth 0. Both keep the live

      // here — Chromium rejects it spuriously for an image that is display:none
      // while still going on to paint it.

        if (p.img.getAttribute('src') !== url) return;
        if (!p.img.naturalWidth) { fail(p); return; }

  function iconNode(slug) {

      '<g transform="rotate(45)">' + bar + '</g><g transform="rotate(-45)">' + bar + '</g></g></svg>';

  function buildHeader() {

    var spacer = document.createElement('div'); spacer.className = 'gw-header-spacer';
    headerEl.appendChild(spacer);
    var days = document.createElement('div'); days.className = 'gw-days';

      var t = textNode(letter, 'day-' + letter, 'gw-day-t');
      t.dataset.column = i;
      day.appendChild(t); days.appendChild(day);

    rowsEl.innerHTML = '';
    rows.forEach(function (row, index) {
      var el = document.createElement('div'); el.className = 'gw-row';
      var label = document.createElement('div'); label.className = 'gw-label';
      var iconCol = document.createElement('div'); iconCol.className = 'gw-icon-col';
      row.icon = iconNode(row.habit.slug);

      row.track = track;

      rowsEl.appendChild(el);

  function renderRow(index) {
    var row = rows[index];
    row.spans = rowSpans(row.habit.target, row.completed, today);
    row.track.innerHTML = '';
    row.spans.forEach(function (span) {
      var n = span.last - span.first + 1;
      var tappable = span.state === 'open' || (span.state === 'done' && span.first <= today && today <= span.last && row.completed[today]);
      var el = document.createElement(tappable ? 'button' : 'div');
      el.className = 'gw-span is-' + span.state;
      el.style.setProperty('--first', span.first);
      el.style.setProperty('--n', n);
      if (tappable) {
        el.type = 'button';
        el.setAttribute('aria-label', row.habit.name + (span.state === 'open' ? ', open today. Mark done' : ', done today. Undo'));
        el.addEventListener('click', function () { toggleToday(index); });
      }
      if (span.state === 'missed') {
        el.innerHTML = CROSS;
      } else {
        var socket = document.createElement('div'); socket.className = 'gw-socket'; el.appendChild(socket);
        if (span.state === 'done') {
          var done = document.createElement('div'); done.className = 'gw-done'; el.appendChild(done);
        } else if (span.state === 'open') {
          var ring = document.createElement('div'); ring.className = 'gw-ring gw-live'; el.appendChild(ring);
          el.classList.add('is-emitting');
          plate(el, 'ring-' + n);
        }
      }
      row.track.appendChild(el);
    });
  }

  function toggleToday(index) {
    var row = rows[index];
    if (row.completed[today]) delete row.completed[today]; else row.completed[today] = true;
    // Invariant 7: completing today changes the open window to filled without
    // moving the remaining future windows, so the row can simply be redrawn.
    plates = plates.filter(function (p) { return !row.track.contains(p.img); });
    renderRow(index);
    loadPlates();
    updateTiers();
  }

  // TypeTier: a name and its icon emit while the row has an open mark today;
  // today's letter emits while any row does. Everything else is lit.
  function updateTiers() {
    var anyOpen = false;
    rows.forEach(function (row) {
      var open = row.spans.some(function (s) { return s.state === 'open'; });
      anyOpen = anyOpen || open;
      row.name.classList.toggle('is-emitting', open);
      row.icon.classList.toggle('is-emitting', open);
    });
    var letters = headerEl.querySelectorAll('.gw-day-t');
    for (var i = 0; i < letters.length; i++) {
      letters[i].classList.toggle('is-emitting', i === today && anyOpen);
    }
  }

  // ─── Tilt ──────────────────────────────────────────────────────────────
  // A slow, weighty float under a fine pointer. Nothing on touch, nothing
  // under reduced motion: the card just sits.
  (function tilt() {
    var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    root.dataset.tilt = (fine.matches && !reduced.matches) ? 'on' : 'off';
    if (!fine.matches || reduced.matches) return;
    var MAX = 7, targetX = 0, targetY = 0, x = 0, y = 0, running = false;
    function frame() {
      x += (targetX - x) * 0.055; y += (targetY - y) * 0.055;
      card.style.setProperty('--tilt-y', (x * MAX).toFixed(3) + 'deg');
      card.style.setProperty('--tilt-x', (-y * MAX).toFixed(3) + 'deg');
      card.style.setProperty('--shadow-x', (-x * 22).toFixed(2) + 'px');
      card.style.setProperty('--shadow-y', (-y * 22).toFixed(2) + 'px');
      if (Math.abs(targetX - x) + Math.abs(targetY - y) > 0.0005) requestAnimationFrame(frame);
      else running = false;
    }
    function kick() { if (!running) { running = true; requestAnimationFrame(frame); } }
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      var r = card.getBoundingClientRect();
      var dx = (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2);
      var dy = (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2);
      targetX = Math.max(-1, Math.min(1, dx)); targetY = Math.max(-1, Math.min(1, dy));
      kick();
    }, { passive: true });
    document.addEventListener('pointerleave', function () { targetX = 0; targetY = 0; kick(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { targetX = 0; targetY = 0; kick(); } });
    reduced.addEventListener('change', function (e) { if (e.matches) { targetX = targetY = x = y = 0; card.style.transform = ''; } });
  })();

  // ─── Boot ──────────────────────────────────────────────────────────────
  function boot(data) {
    useData(data);
    seed(); buildHeader(); buildRows();

    hdrQuery.addEventListener('change', loadPlates);                 // moved to another screen
    Object.keys(tierQueries).forEach(function (k) { tierQueries[k].addEventListener('change', loadPlates); });
    window.addEventListener('resize', loadPlates);                   // devicePixelRatio has no event of its own

    // A day boundary re-seeds: "today" is the visitor's date, not the load time.
    (function scheduleMidnight() {
      var now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
      setTimeout(function () { plates = plates.filter(function (p) { return !rowsEl.contains(p.img); }); seed(); buildRows(); scheduleMidnight(); }, next - now);
    })();
  }
  if (INLINE) {
    boot(INLINE);
  } else if (root.dataset.manifest) {
    // One request, before anything is drawn, for the manifest. If it fails the
    // card still draws — every tier as live CSS, no plates, as on an SDR screen.
    fetch(root.dataset.manifest, { credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(boot, function () { boot({ manifests: {}, icons: {} }); });
  }

  // For the page's own checks (and nothing else): what the card decided.
  window.GlowWeek = { get set() { return currentSet; }, get hdr() { return hdrQuery.matches; }, get today() { return today; }, rows: function () { return rows.map(function (r) { return { name: r.habit.name, spans: r.spans }; }); } };
})();
</script>
