<!doctype html><meta charset="utf-8"><title>marks</title>
<style>
body{margin:0;background:#202020}
.row{display:flex;gap:16px;padding:16px;--s:2;--cell:48px;--inset:2px;--bevel:3px;--well:12px;--lit:#D9D9D9}
.cell{position:relative;width:48px;height:48px}
.gw-socket{position:absolute;inset:0;border-radius:999px;background:rgba(0,0,0,.15);box-shadow:inset 0 var(--bevel) calc(2*var(--bevel)) #000, inset 0 calc(-1*var(--bevel)) calc(2*var(--bevel)) rgba(255,255,255,.13)}
.gw-done{position:absolute;inset:var(--inset);border-radius:999px;background:var(--lit);box-shadow:inset 0 var(--well) calc(2*var(--well)) rgba(0,0,0,.25), inset 0 calc(-1*var(--inset)) calc(2*var(--inset)) rgba(0,0,0,.3), inset 0 var(--inset) calc(2*var(--inset)) #fff}
.gw-cross{position:absolute;inset:0;width:100%;height:100%}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="gw-cross-well" x="-30%" y="-30%" width="160%" height="160%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="3.52" result="b1"/><feOffset in="b1" dy="3.52" result="o1"/><feComposite in="SourceAlpha" in2="o1" operator="out" result="m1"/><feFlood flood-color="#000" flood-opacity="1" result="c1"/><feComposite in="c1" in2="m1" operator="in" result="s1"/>
<feOffset in="b1" dy="-3.52" result="o2"/><feComposite in="SourceAlpha" in2="o2" operator="out" result="m2"/><feFlood flood-color="#fff" flood-opacity="0.25" result="c2"/><feComposite in="c2" in2="m2" operator="in" result="s2"/>
<feGaussianBlur in="SourceAlpha" stdDeviation="12.5" result="b3"/><feOffset in="b3" dy="16.67" result="o3"/><feComposite in="SourceAlpha" in2="o3" operator="out" result="m3"/><feFlood flood-color="#000" flood-opacity="0.48" result="c3"/><feComposite in="c3" in2="m3" operator="in" result="s3"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="s3"/></feMerge></filter></defs></svg>
<div class="row"><div class="cell"><div class="gw-socket"></div></div><div class="cell"><div class="gw-socket"></div><div class="gw-done"></div></div><div class="cell" id="x"></div></div>
<script>
var side=100,t=side*9/32,r=side*0.0352,half=side*11/12/2,len=2*(half-r)*Math.SQRT2-t+4*r;
var bar='<rect x="'+(-len/2)+'" y="'+(-t/2)+'" width="'+len+'" height="'+t+'" rx="'+r+'" ry="'+r+'"/>';
document.getElementById('x').innerHTML='<svg class="gw-cross" viewBox="0 0 100 100"><g transform="translate(50 50)" fill="rgba(0,0,0,0.15)" filter="url(#gw-cross-well)"><g transform="rotate(45)">'+bar+'</g><g transform="rotate(-45)">'+bar+'</g></g></svg>';
</script>
